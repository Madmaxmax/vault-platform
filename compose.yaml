name: vault-integration-demo
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d appdb"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [internal]

  vault:
    image: hashicorp/vault:1.18
    cap_add: [IPC_LOCK]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID:?Set VAULT_DEV_ROOT_TOKEN_ID in .env}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    command: ["server", "-dev"]
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [internal]

  bootstrap:
    user: "0:0" # local demo: writes bootstrap credentials
    image: hashicorp/vault:1.18
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN_ID:?Set VAULT_DEV_ROOT_TOKEN_ID in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    entrypoint: ["/bin/sh", "/scripts/bootstrap.sh"]
    volumes:
      - ./infra/vault/scripts:/scripts:ro
      - ./infra/vault/policies:/policies:ro
      - ./runtime:/bootstrap
    depends_on:
      vault: {condition: service_healthy}
      postgres: {condition: service_healthy}
    networks: [internal]

  vault-agent:
    user: "0:0" # local demo: reads bootstrap credentials; harden for production
    image: hashicorp/vault:1.18
    environment:
      VAULT_ADDR: http://vault:8200
    command: ["agent", "-config=/etc/vault-agent/agent.hcl"]
    volumes:
      - ./infra/vault/agent:/etc/vault-agent:ro
      - ./runtime:/bootstrap:ro
      - rendered_secrets:/run/rendered
    depends_on:
      bootstrap: {condition: service_completed_successfully}
    networks: [internal]

  app:
    build: ./app
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: appdb
      CREDENTIALS_FILE: /run/rendered/postgres.json
    volumes:
      - rendered_secrets:/run/rendered:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres: {condition: service_healthy}
      vault-agent: {condition: service_started}
    networks: [internal]

networks:
  internal:
    internal: true

volumes:
  postgres_data:
  rendered_secrets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=16m,mode=0755
